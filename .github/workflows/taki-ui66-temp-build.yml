name: Temporary TAKI UI66 Builder

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'android-dashboard/**'
      - '.github/workflows/taki-ui66-temp-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android 36
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Clone Launcher66 v1.2.0
        run: git clone --depth 1 --branch v1.2.0 https://github.com/vasyl91/FYT-Launcher-Mod.git FYT-Launcher-Mod

      - name: Apply TAKI HOUSE UI66 patch
        run: |
          python3 android-dashboard/patch_ui66.py
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path("FYT-Launcher-Mod/app/build.gradle.kts")
          s=p.read_text()
          if 'signingConfig = signingConfigs.getByName("release")' not in s:
              s2, n = re.subn(
                  r'(\brelease\s*\{)',
                  r'\1\n            signingConfig = signingConfigs.getByName("release")',
                  s,
                  count=1
              )
              if n != 1:
                  raise SystemExit("release block not found")
              s=s2
          p.write_text(s)
          PY
          grep -q "initTakiSpeedOverlay" FYT-Launcher-Mod/app/src/main/java/com/android/launcher66/Launcher.java
          test -s FYT-Launcher-Mod/app/src/main/res/drawable-sw600dp-mdpi/def_bg.webp

      - name: Build signed release
        working-directory: FYT-Launcher-Mod
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --stacktrace --no-daemon

      - name: Package installer
        run: |
          mkdir -p dist
          APK="$(find FYT-Launcher-Mod/app/build/outputs/apk/release -type f -name '*.apk' | head -1)"
          test -n "$APK"
          cp "$APK" dist/190001066_com.android.launcher66.apk
          curl -L --fail --retry 3 https://github.com/vasyl91/FYT-Launcher-Mod/releases/download/v1.2.0/installer.zip -o original-installer.zip
          unzip -q original-installer.zip -d package
          cp dist/190001066_com.android.launcher66.apk package/installer/launcher/190001066_com.android.launcher66/190001066_com.android.launcher66.apk
          cd package
          zip -qr ../dist/TAKI_UI66_OUTLANDER_v1.0_INSTALLER.zip installer
          cd ..
          sha256sum dist/190001066_com.android.launcher66.apk dist/TAKI_UI66_OUTLANDER_v1.0_INSTALLER.zip > dist/SHA256.txt
          ls -lh dist

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: TAKI_UI66_OUTLANDER_v1.0
          path: |
            dist/TAKI_UI66_OUTLANDER_v1.0_INSTALLER.zip
            dist/190001066_com.android.launcher66.apk
            dist/SHA256.txt
          if-no-files-found: error
